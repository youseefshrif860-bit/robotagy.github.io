<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- كود إجبار المتصفح على مسح الكاش وتحديث الموقع للنسخة النهائية -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
        // التحديث التلقائي للنسخة (v=10) لتفعيل التحديث اللحظي للحضور
        if (window.location.href.indexOf('?v=10') === -1) {
            window.location.replace(window.location.href.split('?')[0] + '?v=10');
        }
    </script>

    <title>معمل روبوتاجي</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #3b1e5a; color: white; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: #fcc01a; }
        .admin-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .container { background-color: #4c2673; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        input, select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border-radius: 5px; border: none; box-sizing: border-box; font-family: Tahoma; }
        .submit-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        #admin-view, #login-view { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white; color: black; border-radius: 5px; overflow: hidden; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #fcc01a; color: #3b1e5a; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .delete-all-btn { background-color: #cc0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        
        .nav-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; text-align: center; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        .nav-btn:hover { background-color: #e5ad17; }
        .back-btn { background-color: white; color: #3b1e5a; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 0; }
        .add-btn { background-color: #28a745; color: white; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; margin-bottom: 15px; }
        
        .attendance-check { width: 22px; height: 22px; cursor: pointer; accent-color: #3b1e5a; }

        /* ستايل النوافذ المنبثقة (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid #fcc01a;
            width: 90%;
            max-width: 400px;
            text-align: right;
            color: black;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .modal-close-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .modal-close-btn:hover { background-color: #218838; }

        /* ستايل قائمة الاقتراحات للبحث */
        #search-suggestions {
            position: absolute; width: 100%; background: white; color: black; z-index: 1001;
            max-height: 150px; overflow-y: auto; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none; top: 100%; left: 0;
        }
        .suggestion-item {
            padding: 10px; cursor: pointer; border-bottom: 1px solid #ddd; font-size: 14px;
        }
        .suggestion-item:hover { background-color: #fcc01a; color: #3b1e5a; font-weight: bold; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>
<body>

<div class="header">
    <div class="logo">روبوتاجي</div>
    <button class="admin-btn" onclick="showLogin()">الإدارة</button>
</div>

<!-- واجهة الطلاب -->
<div class="container" id="student-view">
    <form id="regForm">
        <label>الاسم:</label>
        <input type="text" id="name" required>

        <label>رقم الهاتف:</label>
        <input type="tel" id="phone" required>

        <label>رقم المجموعة:</label>
        <input type="text" id="group" required>

        <label>الكورس:</label>
        <select id="course" required>
            <option value="" disabled selected>اختر الكورس</option>
            <option value="PLC">PLC</option>
            <option value="Classic Control">Classic Control</option>
            <option value="Motor Drive">Motor Drive</option>
        </select>

        <label>مواعيد الحضور:</label>
        <div id="appointments-container">
            <div class="appointment-row" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                <input type="date" class="date-input" required onchange="updateTimeOptions(this)" style="margin:0; width: 50%;">
                <select class="time-input" required style="margin:0; width: 50%;">
                    <option value="" disabled selected>اختر التاريخ أولاً</option>
                </select>
            </div>
        </div>
        
        <button type="button" class="add-btn" onclick="addAppointment()">+ إضافة موعد آخر</button>

        <button type="submit" class="submit-btn" id="main-submit-btn">تأكيد التسجيل</button>
    </form>
</div>

<!-- نافذة التأكيد المنبثقة (النجاح) -->
<div class="modal-overlay" id="success-modal">
    <div class="modal-content">
        <strong style="color: black; display: block; margin-bottom: 10px; font-size: 16px;">تم تأكيد التسجيل بنجاح. بيان المواعيد:</strong>
        <ul id="modal-appointments-list" style="margin: 0; padding-right: 20px; color: black; line-height: 1.8; font-size: 14px;">
        </ul>
        <button class="modal-close-btn" onclick="closeSuccessModal()">موافق</button>
    </div>
</div>

<!-- نافذة التنبيه المنبثقة (الخطأ / الموعد ممتلئ / الحظر) -->
<div class="modal-overlay" id="error-modal">
    <div class="modal-content" style="border-color: #ff4d4d;">
        <strong style="color: #ff4d4d; display: block; margin-bottom: 10px; font-size: 16px;">تنبيه هام</strong>
        <p id="error-modal-msg" style="margin: 0; color: black; line-height: 1.8; font-size: 14px; font-weight: bold;"></p>
        <button class="modal-close-btn" style="background-color: #ff4d4d;" onclick="closeErrorModal()">إغلاق التنبيه</button>
    </div>
</div>

<!-- واجهة تسجيل الدخول للإدارة -->
<div class="container" id="login-view">
    <h2 style="text-align: center; color: #fcc01a;">تسجيل الدخول للإدارة</h2>
    <form id="loginForm">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="admin-email" required placeholder="admin@robotagy.com">
        
        <label>الرقم السري:</label>
        <input type="password" id="admin-password" required placeholder="••••••••">
        
        <button type="submit" class="submit-btn">دخول</button>
        <button type="button" class="back-btn" style="width: 100%; margin-top: 10px;" onclick="closeLogin()">إلغاء والعودة</button>
    </form>
    <p id="login-msg" style="text-align:center; color:#ff4d4d; font-weight:bold; margin-top: 15px;"></p>
</div>

<!-- واجهة الإدارة -->
<div class="container" id="admin-view" style="max-width: 950px;">
    <h2 style="text-align: center; color: #fcc01a;">لوحة تحكم م. يوسف شريف</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <button class="admin-btn" onclick="logoutAdmin()">تسجيل الخروج</button>
        <button class="delete-all-btn" style="margin-bottom: 0;" onclick="deleteAllData()">حذف كل التسجيلات بالكامل</button>
    </div>

    <!-- مربع البحث الذكي -->
    <div style="position: relative; margin-bottom: 20px;">
        <input type="text" id="search-student" placeholder="ابحث عن اسم الطالب هنا لإنشاء تقرير وإدارة الحظر..." oninput="handleSearch(this.value)" autocomplete="off" style="margin: 0; border: 2px solid #fcc01a; background: #fff; color: #000; font-weight: bold;">
        <div id="search-suggestions"></div>
    </div>

    <div id="dates-list">
        <h3 style="text-align: center; color: white;">أيام الحجز المسجلة</h3>
        <div id="dates-container"></div>
    </div>

    <div id="periods-list" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="back-btn" onclick="backToDates()">الرجوع لقائمة الأيام ↲</button>
            <button class="delete-all-btn" style="margin-bottom: 0;" onclick="deleteAllInDay()">حذف تسجيلات هذا اليوم</button>
        </div>
        <h3 id="selected-date-title" style="text-align: center; color: #fcc01a; margin-top: 0;"></h3>
        <div id="periods-container"></div>
    </div>

    <div id="period-details" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="back-btn" onclick="backToPeriods()">الرجوع للفترات ↲</button>
            <button class="delete-all-btn" style="margin-bottom: 0;" onclick="deleteAllInPeriod()">حذف تسجيلات هذه الفترة</button>
        </div>
        <h3 id="selected-period-title" style="text-align: center; color: #fcc01a; margin-top: 0;"></h3>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>المجموعة</th>
                        <th>الكورس</th>
                        <th>التاريخ</th>
                        <th>الوقت</th>
                        <th>حضور</th>
                        <th>تحكم</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- نافذة تقرير الطالب والتحكم في الحظر -->
<div class="modal-overlay" id="report-modal">
    <div class="modal-content" style="max-width: 600px;">
        <strong style="color: #3b1e5a; display: block; margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #fcc01a; padding-bottom: 5px;" id="report-name"></strong>
        <div style="margin-bottom: 15px; font-size: 15px; color: black; line-height: 1.8;">
            <div>رقم الهاتف: <b id="report-phone" style="color: #3b1e5a; font-family: Tahoma;"></b></div>
            <div>إجمالي المواعيد المسجلة: <b id="report-total" style="color: #3b1e5a;"></b></div>
            <div>مرات الغياب (لم يحضر): <b id="report-absent" style="color: red;"></b></div>
            <div>تاريخ آخر حضور: <b id="report-last" style="color: green;"></b></div>
        </div>
        
        <strong style="color: #000; display: block; margin-bottom: 10px; font-size: 14px;">التفاصيل:</strong>
        <div style="overflow-x: auto; max-height: 200px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 15px;">
            <table style="width: 100%; font-size: 13px; margin-top: 0; border-radius: 0;">
                <thead>
                    <tr>
                        <th style="padding: 8px;">الكورس</th>
                        <th style="padding: 8px;">التاريخ</th>
                        <th style="padding: 8px;">الوقت</th>
                        <th style="padding: 8px;">الحالة</th>
                    </tr>
                </thead>
                <tbody id="report-tbody"></tbody>
            </table>
        </div>
        
        <button id="block-btn" style="width: 100%; padding: 12px; margin-bottom: 10px; font-size: 15px; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;"></button>
        <button class="modal-close-btn" style="background-color: #3b1e5a; margin-top: 0;" onclick="closeReportModal()">إغلاق التقرير</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDEl0FbR_gjtOwRxOBS8_YWN_4HfyzyddU",
      authDomain: "robotagy-1f557.firebaseapp.com",
      databaseURL: "https://robotagy-1f557-default-rtdb.firebaseio.com",
      projectId: "robotagy-1f557",
      storageBucket: "robotagy-1f557.firebasestorage.app",
      messagingSenderId: "994345653468",
      appId: "1:994345653468:web:4fbab3bdc2e09061089019"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    const normalizeText = (str) => String(str || '').replace(/[\s\u200B-\u200D\uFEFF]/g, '').trim();

    const today = new Date().toISOString().split('T')[0];
    document.querySelector('.date-input').setAttribute('min', today);

    function updateTimeOptions(element) {
        const dateVal = element.value;
        const timeSelect = element.parentElement.querySelector('.time-input');
        timeSelect.innerHTML = ''; 

        if (!dateVal) return;
        const day = new Date(dateVal).getDay(); 

        if (day === 5) { 
            let o = document.createElement('option');
            o.value = ''; o.text = 'المعمل مغلق يوم الجمعة'; o.disabled = true; o.selected = true;
            timeSelect.appendChild(o);
        } 
        else if (day === 0 || day === 4 || day === 6) { 
            let defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.text = 'اختر الوقت'; defaultOpt.disabled = true; defaultOpt.selected = true;
            timeSelect.appendChild(defaultOpt);
            ['من 12 ظهراً إلى 3 عصراً', 'من 3 عصراً إلى 6 مساءً', 'من 6 مساءً إلى 9 مساءً'].forEach(opt => {
                let o = document.createElement('option'); o.value = opt; o.text = opt; timeSelect.appendChild(o);
            });
        } 
        else { 
            let defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.text = 'اختر الوقت'; defaultOpt.disabled = true; defaultOpt.selected = true;
            timeSelect.appendChild(defaultOpt);
            let o = document.createElement('option'); o.value = 'من 8 مساءً إلى 11 مساءً'; o.text = 'من 8 مساءً إلى 11 مساءً';
            timeSelect.appendChild(o);
        }
    }

    function addAppointment() {
        const container = document.getElementById('appointments-container');
        const row = document.createElement('div');
        row.className = 'appointment-row';
        row.style = 'display: flex; gap: 10px; margin-bottom: 10px; align-items: center;';
        row.innerHTML = `
            <input type="date" class="date-input" min="${today}" required onchange="updateTimeOptions(this)" style="margin:0; width: 45%;">
            <select class="time-input" required style="margin:0; width: 45%;">
                <option value="" disabled selected>اختر التاريخ أولاً</option>
            </select>
            <button type="button" onclick="this.parentElement.remove()" style="width: 10%; background: #ff4d4d; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 10px; font-weight:bold;">X</button>
        `;
        container.appendChild(row);
    }

    function closeSuccessModal() { document.getElementById('success-modal').style.display = 'none'; }
    function showErrorModal(message) {
        document.getElementById('error-modal-msg').innerHTML = message;
        document.getElementById('error-modal').style.display = 'flex';
    }
    function closeErrorModal() { document.getElementById('error-modal').style.display = 'none'; }

    let isSubmitting = false;

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (isSubmitting) return; 
        isSubmitting = true;
        
        const submitBtn = document.getElementById('main-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري التحقق والتسجيل...';
        submitBtn.style.opacity = '0.7';
        submitBtn.style.cursor = 'not-allowed';

        function resetBtn() {
            submitBtn.disabled = false;
            submitBtn.innerText = 'تأكيد التسجيل';
            submitBtn.style.opacity = '1';
            submitBtn.style.cursor = 'pointer';
            isSubmitting = false;
        }

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const group = document.getElementById('group').value;
        const course = document.getElementById('course').value;
        
        const maxLimit = (course === 'Motor Drive') ? 2 : 8;

        const appointmentRows = document.querySelectorAll('.appointment-row');
        let appointments = [];
        let hasDuplicate = false;
        let tempSet = new Set();

        appointmentRows.forEach(row => {
            const d = row.querySelector('.date-input').value;
            const t = row.querySelector('.time-input').value;
            const key = d + '|' + t;
            
            if(tempSet.has(key)) hasDuplicate = true;
            tempSet.add(key);
            appointments.push({ date: d, time: t });
        });

        if (hasDuplicate) {
            showErrorModal('لقد قمت باختيار نفس الموعد (تاريخ ووقت) أكثر من مرة.<br><br>يرجى تعديل المواعيد.');
            resetBtn();
            return;
        }

        try {
            const blockedSnap = await database.ref('blocked_phones').get();
            let isBlocked = false;
            const normalizedInputPhone = normalizeText(phone);
            
            if (blockedSnap.exists()) {
                const blockedData = blockedSnap.val();
                Object.keys(blockedData).forEach(key => {
                    if (normalizeText(blockedData[key].phone) === normalizedInputPhone) {
                        isBlocked = true;
                    }
                });
            }

            if (isBlocked) {
                showErrorModal('عفواً، لا يمكنك التسجيل في الوقت الحالي. يرجى مراجعة إدارة المعمل.');
                resetBtn();
                return;
            }

            const snapshot = await database.ref('students').get();
            let dbData = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                Object.keys(data).forEach(key => dbData.push(data[key]));
            }

            for (let i = 0; i < appointments.length; i++) {
                const app = appointments[i];
                let currentCountInDB = dbData.filter(d => 
                    normalizeText(d.date) === normalizeText(app.date) && 
                    normalizeText(d.time) === normalizeText(app.time) && 
                    normalizeText(d.course) === normalizeText(course)
                ).length;
                
                if (currentCountInDB >= maxLimit) {
                    showErrorModal(`عفواً، الموعد يوم <b>(${app.date})</b> في الفترة <b>(${app.time})</b> ممتلئ لكورس <b>(${course})</b>.<br><br>المقاعد محجوزة بالكامل في هذا الموعد.<br>يرجى اختيار موعد آخر أو حذفه.`);
                    resetBtn();
                    return; 
                }
            }

            let promises = [];
            appointments.forEach(app => {
                const record = { name, phone, group, course, date: app.date, time: app.time, attended: false, timestamp: new Date().toLocaleString() };
                promises.push(database.ref('students').push(record));
            });

            await Promise.all(promises);

            const list = document.getElementById('modal-appointments-list');
            list.innerHTML = '';
            appointments.forEach(app => {
                list.innerHTML += `<li>تاريخ الحضور: <b>${app.date}</b> &nbsp;|&nbsp; الفترة: <b>${app.time}</b></li>`;
            });
            
            document.getElementById('success-modal').style.display = 'flex';
            document.getElementById('regForm').reset();
            document.getElementById('appointments-container').innerHTML = `
                <div class="appointment-row" style="display: flex; gap: 10px; margin-bottom: 10px; align-items: center;">
                    <input type="date" class="date-input" min="${today}" required onchange="updateTimeOptions(this)" style="margin:0; width: 50%;">
                    <select class="time-input" required style="margin:0; width: 50%;">
                        <option value="" disabled selected>اختر التاريخ أولاً</option>
                    </select>
                </div>
            `;
            
            resetBtn();
            setTimeout(() => { closeSuccessModal(); }, 5000);

        } catch (error) {
            showErrorModal('حدث خطأ أثناء الاتصال بقاعدة البيانات: ' + error.message);
            resetBtn();
        }
    });

    // ----------------- نظام تسجيل الدخول والإدارة -----------------
    
    function showLogin() {
        document.getElementById('student-view').style.display = 'none';
        document.getElementById('login-view').style.display = 'block';
    }

    function closeLogin() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('student-view').style.display = 'block';
        document.getElementById('login-msg').innerText = '';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('admin-email').value;
        const pass = document.getElementById('admin-password').value;

        auth.signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                document.getElementById('loginForm').reset();
                loadData();
            })
            .catch((error) => {
                document.getElementById('login-msg').innerText = 'بيانات الدخول غير صحيحة!';
            });
    });

    function logoutAdmin() {
        auth.signOut().then(() => {
            document.getElementById('admin-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
            backToDates(); 
        });
    }

    let allStudents = [];
    let blockedPhonesList = [];
    let currentSelectedDate = null;
    let currentSelectedPeriod = null;

    function loadData() {
        database.ref('students').on('value', (snapshot) => {
            allStudents = [];
            if (snapshot.exists()) {
                snapshot.forEach(childSnapshot => {
                    allStudents.push({ id: childSnapshot.key, ...childSnapshot.val() });
                });
            }
            
            // تحديث نافذة التقرير لحظياً لو كانت مفتوحة
            let reportModal = document.getElementById('report-modal');
            if (reportModal && reportModal.style.display === 'flex') {
                let titleText = document.getElementById('report-name').innerText;
                if (titleText.startsWith('تقرير الطالب: ')) {
                    let currentName = titleText.replace('تقرير الطالب: ', '');
                    if (currentName) selectStudent(currentName);
                }
            }

            if (currentSelectedDate) {
                let studentsInDay = allStudents.filter(s => s.date === currentSelectedDate);
                if (studentsInDay.length === 0) {
                    backToDates();
                } else if (currentSelectedPeriod) {
                    let studentsInPeriod = studentsInDay.filter(s => s.time === currentSelectedPeriod);
                    if (studentsInPeriod.length === 0) {
                        backToPeriods();
                    } else {
                        showPeriodDetails(currentSelectedDate, currentSelectedPeriod);
                    }
                } else {
                    renderPeriodsList(currentSelectedDate);
                }
            } else {
                renderDatesList();
            }
        });

        database.ref('blocked_phones').on('value', (snapshot) => {
            blockedPhonesList = [];
            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    blockedPhonesList.push({ id: child.key, phone: child.val().phone, name: child.val().name });
                });
            }
        });
    }

    function handleSearch(query) {
        const container = document.getElementById('search-suggestions');
        if (!query.trim()) { 
            container.style.display = 'none'; 
            return; 
        }
        
        let uniqueNames = [...new Set(allStudents.map(s => s.name))];
        let matches = uniqueNames.filter(n => n && n.toLowerCase().includes(query.toLowerCase()));
        
        if (matches.length === 0) {
            container.innerHTML = '<div class="suggestion-item" style="color:red;">لا يوجد طالب بهذا الاسم</div>';
        } else {
            container.innerHTML = matches.map(n => `<div class="suggestion-item" onclick="selectStudent('${n}')">${n}</div>`).join('');
        }
        container.style.display = 'block';
    }

    function selectStudent(studentName) {
        document.getElementById('search-student').value = '';
        document.getElementById('search-suggestions').style.display = 'none';
        
        let studentRecords = allStudents.filter(s => s.name === studentName);
        if(studentRecords.length === 0) {
            closeReportModal();
            return;
        }
        
        studentRecords.sort((a,b) => new Date(b.date) - new Date(a.date));
        let studentPhone = studentRecords[0].phone; 
        
        let total = studentRecords.length;
        let attendedRecords = studentRecords.filter(s => s.attended);
        let absent = total - attendedRecords.length;
        
        let lastAttended = 'لم يحضر أي موعد بعد';
        if(attendedRecords.length > 0) {
            attendedRecords.sort((a,b) => new Date(b.date) - new Date(a.date));
            lastAttended = attendedRecords[0].date;
        }
        
        document.getElementById('report-name').innerText = 'تقرير الطالب: ' + studentName;
        document.getElementById('report-phone').innerText = studentPhone;
        document.getElementById('report-total').innerText = total;
        document.getElementById('report-absent').innerText = absent;
        document.getElementById('report-last').innerText = lastAttended;
        
        let normalizedStudentPhone = normalizeText(studentPhone);
        let isBlocked = blockedPhonesList.some(b => normalizeText(b.phone) === normalizedStudentPhone);
        
        let blockBtn = document.getElementById('block-btn');
        if (isBlocked) {
            blockBtn.innerText = "إلغاء حظر الطالب";
            blockBtn.style.backgroundColor = "#28a745"; 
            blockBtn.onclick = () => toggleBlockStudent(studentPhone, studentName, true);
        } else {
            blockBtn.innerText = "حظر الطالب من التسجيل 🚫";
            blockBtn.style.backgroundColor = "#ff4d4d"; 
            blockBtn.onclick = () => toggleBlockStudent(studentPhone, studentName, false);
        }

        studentRecords.sort((a,b) => new Date(a.date) - new Date(b.date));
        let tbody = document.getElementById('report-tbody');
        tbody.innerHTML = '';
        studentRecords.forEach(rec => {
            // التعديل الخاص بظهور المربع أو النص الثابت
            let statusHTML = rec.attended 
                ? '<span style="color:green; font-weight:bold;">حاضر ✔</span>' 
                : `<input type="checkbox" class="attendance-check" title="تحديد كحاضر" onchange="updateAttendance('${rec.id}', this.checked)">`;
                
            tbody.innerHTML += `<tr>
                <td style="padding: 8px;">${rec.course || ''}</td>
                <td style="padding: 8px;">${rec.date || ''}</td>
                <td style="padding: 8px;">${rec.time || ''}</td>
                <td style="padding: 8px;">${statusHTML}</td>
            </tr>`;
        });
        
        document.getElementById('report-modal').style.display = 'flex';
    }

    async function toggleBlockStudent(phone, name, currentlyBlocked) {
        const normalizedPhone = normalizeText(phone);
        
        if (currentlyBlocked) {
            let record = blockedPhonesList.find(b => normalizeText(b.phone) === normalizedPhone);
            if (record) {
                await database.ref('blocked_phones/' + record.id).remove();
                alert('تم إلغاء الحظر بنجاح، يمكن للطالب التسجيل الآن.');
                selectStudent(name); 
            }
        } else {
            if (confirm(`هل أنت متأكد من حظر الطالب (${name}) برقم الهاتف (${phone})؟\nلن يتمكن من حجز أي مواعيد جديدة.`)) {
                await database.ref('blocked_phones').push({ phone: phone, name: name });
                alert('تم حظر الطالب بنجاح.');
                selectStudent(name); 
            }
        }
    }

    function closeReportModal() { document.getElementById('report-modal').style.display = 'none'; }

    document.addEventListener('click', function(e) {
        if(e.target.id !== 'search-student') {
            document.getElementById('search-suggestions').style.display = 'none';
        }
    });

    function renderDatesList() {
        document.getElementById('dates-list').style.display = 'block';
        document.getElementById('periods-list').style.display = 'none';
        document.getElementById('period-details').style.display = 'none';
        const container = document.getElementById('dates-container');
        container.innerHTML = '';
        const uniqueDates = [...new Set(allStudents.map(s => s.date))];
        uniqueDates.sort((a, b) => new Date(a) - new Date(b));
        if (uniqueDates.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: white;">لا توجد بيانات مسجلة حتى الآن</p>`;
            return;
        }
        uniqueDates.forEach(date => {
            const studentsInDay = allStudents.filter(s => s.date === date);
            const periodsCount = new Set(studentsInDay.map(s => s.time)).size;
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = `يوم: ${date}  (عدد الفترات: ${periodsCount})`;
            btn.onclick = () => renderPeriodsList(date);
            container.appendChild(btn);
        });
    }

    function renderPeriodsList(date) {
        currentSelectedDate = date;
        currentSelectedPeriod = null;
        document.getElementById('dates-list').style.display = 'none';
        document.getElementById('period-details').style.display = 'none';
        document.getElementById('periods-list').style.display = 'block';
        document.getElementById('selected-date-title').innerText = `إدارة فترات يوم: ${date}`;
        const container = document.getElementById('periods-container');
        container.innerHTML = '';
        let studentsInDay = allStudents.filter(s => s.date === date);
        const uniquePeriods = [...new Set(studentsInDay.map(s => s.time))];
        const timeOrder = { 'من 12 ظهراً إلى 3 عصراً': 1, 'من 3 عصراً إلى 6 مساءً': 2, 'من 6 مساءً إلى 9 مساءً': 3, 'من 8 مساءً إلى 11 مساءً': 4 };
        uniquePeriods.sort((a, b) => (timeOrder[a] || 99) - (timeOrder[b] || 99));
        uniquePeriods.forEach(period => {
            const studentsInPeriod = studentsInDay.filter(s => s.time === period).length;
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = `فترة: ${period} (الطلاب: ${studentsInPeriod})`;
            btn.onclick = () => showPeriodDetails(date, period);
            container.appendChild(btn);
        });
    }

    function showPeriodDetails(date, period) {
        currentSelectedPeriod = period;
        document.getElementById('periods-list').style.display = 'none';
        document.getElementById('period-details').style.display = 'block';
        document.getElementById('selected-period-title').innerText = `جدول فترة (${period}) ليوم ${date}`;
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        let filteredStudents = allStudents.filter(s => s.date === date && s.time === period);
        const courseOrder = { 'Classic Control': 1, 'PLC': 2, 'Motor Drive': 3 };
        filteredStudents.sort((a, b) => (courseOrder[a.course] || 99) - (courseOrder[b.course] || 99));
        filteredStudents.forEach(row => {
            const isChecked = row.attended ? 'checked' : '';
            tbody.innerHTML += `<tr>
                <td>${row.name || ''}</td>
                <td>${row.phone || ''}</td>
                <td>${row.group || ''}</td>
                <td style="font-weight: bold; color: #3b1e5a;">${row.course || ''}</td>
                <td>${row.date || ''}</td>
                <td>${row.time || ''}</td>
                <td><input type="checkbox" class="attendance-check" title="تحديد كحاضر" onchange="updateAttendance('${row.id}', this.checked)" ${isChecked}></td>
                <td><button class="delete-btn" onclick="deleteStudent('${row.id}')">حذف</button></td>
            </tr>`;
        });
    }

    function updateAttendance(id, status) { database.ref('students/' + id).update({ attended: status }).catch(error => alert('خطأ في التحديث: ' + error.message)); }
    function backToDates() { currentSelectedDate = null; currentSelectedPeriod = null; renderDatesList(); }
    function backToPeriods() { currentSelectedPeriod = null; renderPeriodsList(currentSelectedDate); }
    function deleteStudent(id) { if (confirm('هل أنت متأكد من حذف هذا الموعد؟')) database.ref('students/' + id).remove().catch(error => alert('خطأ: ' + error.message)); }
    function deleteAllInPeriod() {
        if (!currentSelectedDate || !currentSelectedPeriod) return;
        if (confirm(`تحذير: هل أنت متأكد من حذف جميع تسجيلات فترة (${currentSelectedPeriod})؟\nلا يمكن التراجع.`)) {
            const studentsToDelete = allStudents.filter(s => s.date === currentSelectedDate && s.time === currentSelectedPeriod);
            let updates = {};
            studentsToDelete.forEach(student => updates[student.id] = null);
            database.ref('students').update(updates).then(() => alert('تم حذف الفترة بنجاح.')).catch(error => alert('خطأ: ' + error.message));
        }
    }
    function deleteAllInDay() {
        if (!currentSelectedDate) return;
        if (confirm(`تحذير: هل أنت متأكد من حذف جميع تسجيلات يوم ${currentSelectedDate} بالكامل؟\nلا يمكن التراجع.`)) {
            const studentsToDelete = allStudents.filter(s => s.date === currentSelectedDate);
            let updates = {};
            studentsToDelete.forEach(student => updates[student.id] = null);
            database.ref('students').update(updates).then(() => alert('تم حذف اليوم بنجاح.')).catch(error => alert('خطأ: ' + error.message));
        }
    }
    function deleteAllData() {
        if (confirm('تحذير نهائي: هل أنت متأكد من حذف جميع تسجيلات الطلاب في كل الأيام بالكامل؟')) {
            database.ref('students').remove().then(() => alert('تم تفريغ البيانات.')).catch(error => alert('خطأ: ' + error.message));
        }
    }
</script>
</body>
</html>
