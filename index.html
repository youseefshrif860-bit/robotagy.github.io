<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معمل روبوتاجي</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #3b1e5a; color: white; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: #fcc01a; }
        .admin-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .container { background-color: #4c2673; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        input, select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border-radius: 5px; border: none; box-sizing: border-box; font-family: Tahoma; }
        .submit-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 12px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        #admin-view { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white; color: black; border-radius: 5px; overflow: hidden; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #fcc01a; color: #3b1e5a; }
        .delete-btn { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .delete-all-btn { background-color: #cc0000; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        
        /* أزرار الأيام الجديدة */
        .date-btn { background-color: #fcc01a; color: #3b1e5a; border: none; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; text-align: center; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        .date-btn:hover { background-color: #e5ad17; }
        .back-btn { background-color: white; color: #3b1e5a; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 0; }
    </style>

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="header">
    <div class="logo">روبوتاجي</div>
    <button class="admin-btn" onclick="checkAdmin()">الإدارة</button>
</div>

<!-- واجهة الطلاب -->
<div class="container" id="student-view">
    <form id="regForm">
        <label>الاسم:</label>
        <input type="text" id="name" required>

        <label>رقم الهاتف:</label>
        <input type="tel" id="phone" required>

        <label>رقم المجموعة:</label>
        <input type="text" id="group" required>

        <label>الكورس:</label>
        <select id="course" required>
            <option value="" disabled selected>اختر الكورس</option>
            <option value="PLC">PLC</option>
            <option value="Classic Control">Classic Control</option>
            <option value="Motor Drive">Motor Drive</option>
        </select>

        <label>تاريخ الحضور:</label>
        <input type="date" id="date" required onchange="updateTimeOptions()">

        <label>وقت الحضور:</label>
        <select id="time" required>
            <option value="" disabled selected>اختر التاريخ أولاً</option>
        </select>

        <button type="submit" class="submit-btn">تأكيد التسجيل</button>
    </form>
    <p id="msg" style="text-align:center; color:#fcc01a; font-weight:bold; margin-top: 15px;"></p>
</div>

<!-- واجهة الإدارة -->
<div class="container" id="admin-view" style="max-width: 900px;">
    <h2 style="text-align: center; color: #fcc01a;">لوحة تحكم م. يوسف شريف</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <button class="admin-btn" onclick="closeAdmin()">تسجيل الخروج من الإدارة</button>
        <button class="delete-all-btn" style="margin-bottom: 0;" onclick="deleteAllData()">حذف كل التسجيلات بالكامل</button>
    </div>

    <!-- قائمة الأيام -->
    <div id="dates-list">
        <h3 style="text-align: center; color: white;">أيام الحجز المسجلة</h3>
        <div id="dates-container"></div>
    </div>

    <!-- تفاصيل اليوم المختار -->
    <div id="date-details" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <button class="back-btn" onclick="backToDates()">الرجوع لقائمة الأيام ↲</button>
            <button class="delete-all-btn" style="margin-bottom: 0;" onclick="deleteAllInDay()">حذف تسجيلات هذا اليوم</button>
        </div>
        <h3 id="selected-date-title" style="text-align: center; color: #fcc01a; margin-top: 0;"></h3>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>المجموعة</th>
                        <th>الكورس</th>
                        <th>التاريخ</th>
                        <th>الوقت</th>
                        <th>تحكم</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // إعدادات مشروع Firebase الخاص بك
    const firebaseConfig = {
      apiKey: "AIzaSyDEl0FbR_gjtOwRxOBS8_YWN_4HfyzyddU",
      authDomain: "robotagy-1f557.firebaseapp.com",
      databaseURL: "https://robotagy-1f557-default-rtdb.firebaseio.com",
      projectId: "robotagy-1f557",
      storageBucket: "robotagy-1f557.firebasestorage.app",
      messagingSenderId: "994345653468",
      appId: "1:994345653468:web:4fbab3bdc2e09061089019"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // منع اختيار تاريخ قديم
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').setAttribute('min', today);

    function updateTimeOptions() {
        const dateVal = document.getElementById('date').value;
        const timeSelect = document.getElementById('time');
        timeSelect.innerHTML = ''; 

        if (!dateVal) return;

        const day = new Date(dateVal).getDay(); 

        if (day === 5) { 
            alert('عفواً، المعمل مغلق يوم الجمعة');
            document.getElementById('date').value = '';
            timeSelect.innerHTML = '<option value="" disabled selected>اختر التاريخ أولاً</option>';
        } 
        else if (day === 0 || day === 4 || day === 6) { 
            const options = ['من 12 ظهراً إلى 3 عصراً', 'من 3 عصراً إلى 6 مساءً', 'من 6 مساءً إلى 9 مساءً'];
            options.forEach(opt => {
                let o = document.createElement('option');
                o.value = opt; o.text = opt;
                timeSelect.appendChild(o);
            });
        } 
        else { 
            let o = document.createElement('option');
            o.value = 'من 8 مساءً إلى 11 مساءً'; 
            o.text = 'من 8 مساءً إلى 11 مساءً';
            timeSelect.appendChild(o);
        }
    }

    // إرسال البيانات والتحقق من العدد الأقصى خفياً
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const course = document.getElementById('course').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        const maxLimit = (course === 'Motor Drive') ? 2 : 8;

        database.ref('students').once('value', (snapshot) => {
            let currentCount = 0;
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    if (data.date === date && data.time === time && data.course === course) {
                        currentCount++;
                    }
                });
            }

            if (currentCount >= maxLimit) {
                alert('عفواً، هذا الموعد ممتلئ لهذا الكورس. يرجى اختيار موعد آخر.');
                return;
            }

            const record = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                group: document.getElementById('group').value,
                course: course,
                date: date,
                time: time,
                timestamp: new Date().toLocaleString()
            };
            
            database.ref('students').push(record)
            .then(() => {
                document.getElementById('msg').innerText = 'تم تسجيل الموعد بنجاح';
                document.getElementById('regForm').reset();
                document.getElementById('time').innerHTML = '<option value="" disabled selected>اختر التاريخ أولاً</option>';
                setTimeout(() => document.getElementById('msg').innerText = '', 4000);
            })
            .catch((error) => {
                alert('حدث خطأ أثناء التسجيل: ' + error.message);
            });
        });
    });

    // الدخول للإدارة بالرقم السري 2004
    function checkAdmin() {
        const pass = prompt('الرجاء إدخال الرقم السري للإدارة:');
        if (pass === '2004') {
            document.getElementById('student-view').style.display = 'none';
            document.getElementById('admin-view').style.display = 'block';
            loadData();
        } else if (pass !== null) {
            alert('الرقم السري غير صحيح!');
        }
    }

    function closeAdmin() {
        document.getElementById('admin-view').style.display = 'none';
        document.getElementById('student-view').style.display = 'block';
        backToDates(); 
    }

    let allStudents = [];
    let currentSelectedDate = null;

    // جلب البيانات الأساسية
    function loadData() {
        database.ref('students').on('value', (snapshot) => {
            allStudents = [];
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    allStudents.push({
                        id: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });
            }
            renderDatesList();
            
            if (currentSelectedDate) {
                showDateDetails(currentSelectedDate);
            }
        });
    }

    // عرض قائمة الأيام
    function renderDatesList() {
        const container = document.getElementById('dates-container');
        container.innerHTML = '';

        const uniqueDates = [...new Set(allStudents.map(s => s.date))];
        uniqueDates.sort((a, b) => new Date(a) - new Date(b));

        if (uniqueDates.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: white;">لا توجد بيانات مسجلة حتى الآن</p>`;
            return;
        }

        uniqueDates.forEach(date => {
            const studentsInDay = allStudents.filter(s => s.date === date).length;
            const btn = document.createElement('button');
            btn.className = 'date-btn';
            btn.innerText = `التسجيلات يوم: ${date}  (عدد الطلاب: ${studentsInDay})`;
            btn.onclick = () => showDateDetails(date);
            container.appendChild(btn);
        });
    }

    // عرض تفاصيل اليوم المحدد
    function showDateDetails(date) {
        currentSelectedDate = date;
        document.getElementById('dates-list').style.display = 'none';
        document.getElementById('date-details').style.display = 'block';
        document.getElementById('selected-date-title').innerText = `جدول يوم: ${date}`;

        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        let filteredStudents = allStudents.filter(s => s.date === date);

        const courseOrder = { 'Classic Control': 1, 'PLC': 2, 'Motor Drive': 3 };
        const timeOrder = {
            'من 12 ظهراً إلى 3 عصراً': 1,
            'من 3 عصراً إلى 6 مساءً': 2,
            'من 6 مساءً إلى 9 مساءً': 3,
            'من 8 مساءً إلى 11 مساءً': 4
        };

        filteredStudents.sort((a, b) => {
            const cA = courseOrder[a.course] || 99;
            const cB = courseOrder[b.course] || 99;
            if (cA < cB) return -1;
            if (cA > cB) return 1;

            const tA = timeOrder[a.time] || 99;
            const tB = timeOrder[b.time] || 99;
            if (tA < tB) return -1;
            if (tA > tB) return 1;

            return 0;
        });

        filteredStudents.forEach((row) => {
            tbody.innerHTML += `<tr>
                <td>${row.name || ''}</td>
                <td>${row.phone || ''}</td>
                <td>${row.group || ''}</td>
                <td style="font-weight: bold; color: #3b1e5a;">${row.course || ''}</td>
                <td>${row.date || ''}</td>
                <td>${row.time || ''}</td>
                <td><button class="delete-btn" onclick="deleteStudent('${row.id}')">حذف</button></td>
            </tr>`;
        });
    }

    // الرجوع للقائمة
    function backToDates() {
        currentSelectedDate = null;
        document.getElementById('date-details').style.display = 'none';
        document.getElementById('dates-list').style.display = 'block';
    }

    // حذف طالب واحد
    function deleteStudent(id) {
        if (confirm('هل أنت متأكد من حذف هذا التسجيل؟')) {
            database.ref('students/' + id).remove().catch((error) => alert('خطأ في الحذف: ' + error.message));
        }
    }

    // حذف جميع تسجيلات اليوم المحدد
    function deleteAllInDay() {
        if (!currentSelectedDate) return;
        
        if (confirm(`تحذير: هل أنت متأكد من حذف جميع تسجيلات يوم ${currentSelectedDate}؟\nلا يمكن التراجع عن هذا القرار.`)) {
            
            // جمع الطلاب الخاصين بهذا اليوم لتجهيزهم للحذف الجماعي
            const studentsToDelete = allStudents.filter(s => s.date === currentSelectedDate);
            let updates = {};
            
            // تهيئة تحديثات قاعدة البيانات لتعيين قيمة الطلاب المحذوفين بـ null
            studentsToDelete.forEach(student => {
                updates[student.id] = null;
            });

            // تنفيذ الحذف الجماعي
            database.ref('students').update(updates)
            .then(() => {
                alert('تم حذف جميع تسجيلات هذا اليوم بنجاح.');
                backToDates(); // الرجوع لقائمة الأيام تلقائياً بعد الحذف
            })
            .catch((error) => {
                alert('خطأ في الحذف: ' + error.message);
            });
        }
    }

    // حذف جميع التسجيلات دفعة واحدة (لكل الأيام)
    function deleteAllData() {
        if (confirm('تحذير نهائي: هل أنت متأكد من حذف جميع تسجيلات الطلاب في كل الأيام بالكامل؟')) {
            database.ref('students').remove()
            .then(() => {
                alert('تم تفريغ جميع البيانات بنجاح.');
                backToDates();
            })
            .catch((error) => alert('خطأ في الحذف: ' + error.message));
        }
    }
</script>
</body>
</html>
